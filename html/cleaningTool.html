<!DOCTYPE html>
<html lang="en">
<head>
    <title>ScrubURLs cleaning tool</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" sizes="any" type="image/svg+xml" href="/img/scruburls.svg">
    <link rel="stylesheet" href="../css/core.css">
</head>
<body>
    <nav class="navbar">
        <span class="navbar-brand">
            <img src="../img/scruburls.svg" alt="">
            <span>
                <span class="brand" id="page_title"></span><br>
                <span class="small-version" id="version"></span>
            </span>
        </span>
    </nav>

    <div class="container narrow text-center">
        <h4 id="cleaning_tool_description"></h4>
        <br>
        <div class="form-group">
            <label for="dirtyURLs" id="cleaning_tool_dirty_urls_label"></label>
            <textarea id="dirtyURLs" name="dirtyURLs" class="form-control" rows="8" cols="60"></textarea>
        </div>
        <p>
            <button type="button" id="cleaning_tool_btn" class="btn btn-success" title="Clean the URLs"></button>
        </p>
        <div class="form-group">
            <label for="cleanURLs" id="cleaning_tool_clean_urls_label"></label>
            <textarea id="cleanURLs" name="cleanURLs" class="form-control" rows="8" cols="60" readonly></textarea>
        </div>
    </div>

    <script type="module" src="../js/cleaning_tool.js"></script>
</body>
</html>
