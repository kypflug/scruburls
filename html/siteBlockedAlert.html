<!DOCTYPE html>
<html lang="en">
<head>
    <title>This site was blocked by ClearURLs</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="icon" sizes="any" type="image/svg+xml" href="/img/clearurls.svg">
    <link rel="stylesheet" href="../css/core.css">
    <style>
        body {
            background-color: #333;
            color: white;
            text-shadow: 0 1px 3px rgba(0, 0, 0, .5);
        }

        h1 {
            color: #f72d04;
        }

        .content {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(90vw, 800px);
        }

        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #212529;
            padding: 6px 16px;
            font-size: 12px;
            color: #adb5bd;
        }
    </style>
</head>
<body>
    <div class="content text-center">
        <h1 id="title"></h1>
        <p id="body"></p>
        <p>
            <a class="btn btn-warning" id="page"></a>
        </p>
        <p class="text-muted" id="source"></p>
    </div>

    <footer>
        <small>ClearURLs v.<span id="version"></span></small>
    </footer>

    <script type="module" src="../js/site_blocked_alert.js"></script>
</body>
</html>
